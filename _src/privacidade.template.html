<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Consent Mode v2: tudo negado até o visitante aceitar (precisa vir antes do GTM) -->
<script>
window.dataLayer = window.dataLayer || [];
dataLayer.push({page_language:'{{code}}'});
function gtag(){ dataLayer.push(arguments); }
gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',wait_for_update:500});
try{ if(localStorage.getItem('rv_consent')==='granted'){ gtag('consent','update',{ad_storage:'granted',ad_user_data:'granted',ad_personalization:'granted',analytics_storage:'granted'}); } }catch(e){}
</script>

})(window,document,'script','dataLayer','GTM-M989M5H');</script>

<title>{{priv_title}}</title>
<meta name="description" content="{{priv_desc}}">

<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#E6E4DE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300..700&display=swap" rel="stylesheet">
{{LOCALFONTS}}
<style>
:root{--abyss:#04130F;--deep:#08211C;--stone:#E6E4DE;--ink:#0C1512;--muted:#4B5853;--line:rgba(12,21,18,.2);--brass:#C2A46B;--brass-ink:#7A5F2B;--pad:clamp(20px,4vw,56px);--font:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--stone);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--brass-ink);outline-offset:4px}
.bar{display:flex;align-items:center;justify-content:space-between;height:76px;padding:0 var(--pad)}
.brand{display:flex;align-items:center;gap:12px;line-height:1;text-decoration:none}
.brand-symbol{font-weight:500;font-size:30px;letter-spacing:-.07em}
.brand-name{font-size:12px;line-height:1.08;letter-spacing:-.01em;font-weight:500}
.back{font-size:14.5px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px}
.back:hover{color:var(--brass-ink)}
.bar-right{display:flex;align-items:center;gap:clamp(14px,3vw,28px)}
.lang{display:flex;font-size:13px;font-weight:500;letter-spacing:.02em}
.lang a{padding:8px 7px;text-decoration:none;opacity:.5;transition:opacity .25s}
.lang a:hover,.lang a[aria-current]{opacity:1}
.lang a[aria-current]{text-decoration:underline;text-underline-offset:5px}
@media (max-width:430px){.brand-name{display:none}}
main{max-width:760px;margin:0 auto;padding:clamp(48px,9vw,112px) var(--pad) clamp(72px,10vw,140px)}
h1{font-weight:500;font-size:clamp(2.6rem,7vw,5rem);line-height:.95;letter-spacing:-.06em;margin-bottom:18px}
.date{color:var(--muted);font-size:15px;margin-bottom:36px}
.lead{font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.45;letter-spacing:-.02em;font-weight:500;margin-bottom:12px}
h2{font-weight:500;font-size:clamp(1.3rem,2.4vw,1.7rem);line-height:1.15;letter-spacing:-.035em;margin:52px 0 12px;padding-top:18px;border-top:1px solid var(--line)}
p,ul{margin-bottom:14px;max-width:64ch}
ul{padding-left:1.2em}
li{margin-bottom:8px}
p,li{color:#1c2622}
code{font-family:inherit;font-weight:500;background:rgba(12,21,18,.07);padding:1px 6px}
a.ul{text-underline-offset:3px}
.btn{display:inline-block;margin:6px 0 0;padding:12px 20px;border:1px solid var(--ink);font-size:14.5px;font-weight:500;text-decoration:none;transition:background .25s,color .25s}
.btn:hover{background:var(--ink);color:var(--stone)}
footer{padding:28px var(--pad) 36px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M989M5H"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header class="bar">
  <a class="brand" href="{{home}}" aria-label="{{priv_back_aria}}"><span class="brand-symbol">rv.</span><span class="brand-name">Rodolfo<br>Vasco</span></a>
  <div class="bar-right">
    <nav class="lang" aria-label="{{lang_aria}}">{{LANG_SWITCH}}</nav>
    <a class="back" href="{{home}}">{{priv_back}}</a>
  </div>
</header>

<main>
{{PRIV_MAIN}}
</main>

<footer><span>© 2026 Rodolfo Vasco</span><a href="{{home}}">{{priv_back}}</a></footer>
<script>
document.addEventListener('click',function(e){var lg=e.target.closest('a[data-lang]');if(!lg)return;
try{localStorage.setItem('rv_lang',lg.getAttribute('data-lang'));}catch(x){}
dataLayer.push({event:'language_switch',language_from:'{{code}}',language_to:lg.getAttribute('data-lang')});});
</script>
</body>
</html>
